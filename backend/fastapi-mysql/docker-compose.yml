name: fastapi-mysql

services:
  mysql:
    image: mysql:8.4
    container_name: fastapi-mysql-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-technology_lab}
      MYSQL_USER: ${MYSQL_USER:-lab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Logs in as the application user, so "healthy" means the app can really connect.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Optional: run the API in a container too (`docker compose up -d --build`).
  fastapi:
    build: .
    container_name: fastapi-mysql-api
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    ports:
      - "${API_PORT:-8002}:8002"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: fastapi-mysql_mysql_data
