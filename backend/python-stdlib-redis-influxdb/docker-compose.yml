name: python-stdlib-redis-influxdb

services:
  redis:
    image: redis:7.4-alpine
    container_name: stdlib-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      # Lets redis-cli in the health check authenticate without a password on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  influxdb:
    image: influxdb:2.7
    container_name: stdlib-influxdb
    environment:
      # First-start setup: creates the org, bucket, admin user and API token.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-lab_admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-technology-lab}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-health}
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Optional: run the API in a container too (`docker compose up -d --build`).
  python:
    build: .
    container_name: stdlib-redis-influxdb-api
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INFLUXDB_URL: http://influxdb:8086
    ports:
      - "${API_PORT:-8006}:8006"
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy

volumes:
  redis_data:
    name: python-stdlib-redis-influxdb_redis_data
  influxdb_data:
    name: python-stdlib-redis-influxdb_influxdb_data
  influxdb_config:
    name: python-stdlib-redis-influxdb_influxdb_config
