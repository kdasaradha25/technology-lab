name: express-mongodb

services:
  mongo:
    image: mongo:8.0
    container_name: express-mongodb-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-lab_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-technology_lab}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Optional: run the API in a container too (`docker compose up -d --build`).
  express:
    build: .
    container_name: express-mongodb-api
    env_file: .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
    ports:
      - "${PORT:-8003}:8003"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    name: express-mongodb_mongo_data
